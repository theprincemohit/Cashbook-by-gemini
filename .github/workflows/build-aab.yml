name: Build Android App Bundle (AAB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: cashDiary android app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Auto-increment Version Code
        run: |
          node -e "const fs=require('fs'); const app=JSON.parse(fs.readFileSync('app.json')); app.expo.android = app.expo.android || {}; app.expo.android.versionCode=${{ github.run_number }}; fs.writeFileSync('app.json', JSON.stringify(app, null, 2));"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build Release Bundle
        env:
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_FILE: ${{ secrets.KEYSTOREPATH }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.KEYALIAS }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTOREPASSWORD }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7